name: Deploy portfolio

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir _site
          for i in 00 01 02 03 04 05; do
            file=$(find . -maxdepth 1 -type f -name "*part-$i" -print -quit)
            test -n "$file"
            cat "$file" >> portfolio.zip
          done
          unzip -q portfolio.zip -d _site
          update_file=$(find . -maxdepth 1 -type f -name "*.zip" ! -name "portfolio.zip" -print -quit)
          test -n "$update_file"
          unzip -oq "$update_file" -d _site
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const assets = path.join('_site', 'assets');
          for (const name of fs.readdirSync(assets).filter((name) => name.endsWith('.js'))) {
            const file = path.join(assets, name);
            let source = fs.readFileSync(file, 'utf8');
            source = source.replaceAll('AI-видео для панно «Парусник»', 'AI-видео для панно «Девятый вал»');
            source = source.replaceAll('portfolio/cards/carrier/01.png', 'portfolio/cards/carrier/01.jpg');
            source = source.replaceAll(
              'Практическое руководство объёмом 65 страниц. В проект вошли структура материала, оформление обложки, работа с текстом и изображениями, подготовка страниц к дальнейшему редактированию.',
              'В портфолио представлен фрагмент из 5 оформленных страниц: обложка, структура и несколько разворотов. Книга находится в работе и будет дорабатываться.'
            );
            source = source.replaceAll('65 страниц', '5 страниц');
            source = source.replaceAll('Открыть книгу в PDF', 'Перелистать 5 страниц');
            source = source.replaceAll(
              '«Карточка шикарная. Мне очень нравится» — отзыв заказчика',
              '«Карточка шикарная! Несмотря на то, что я отправила вам товар в пакете, где нечётко видны детали, вы сделали всё очень хорошо и красиво 😍 Мне очень нравится 👍🏻 Спасибо большое!» — отзыв заказчика'
            );
            fs.writeFileSync(file, source);
          }
          NODE
          cp carrier-main-edited.jpg _site/portfolio/cards/carrier/01.jpg
          rm -f _site/portfolio/book/epoxy-resin-guide.pdf
          cp portfolio-fix.js portfolio-fix.css _site/
          sed -i 's#</head>#<link rel="stylesheet" href="./portfolio-fix.css"></head>#' _site/index.html
          sed -i 's#</body>#<script src="./portfolio-fix.js"></script></body>#' _site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
