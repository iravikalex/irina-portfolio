name: Deploy portfolio

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir _site
          for i in 00 01 02 03 04 05; do
            file=$(find . -maxdepth 1 -type f -name "*part-$i" -print -quit)
            test -n "$file"
            cat "$file" >> portfolio.zip
          done
          unzip -q portfolio.zip -d _site
          update_file=$(find . -maxdepth 1 -type f -name "*.zip" ! -name "portfolio.zip" -print -quit)
          test -n "$update_file"
          unzip -oq "$update_file" -d _site
          find _site/assets -type f -name "*.js" -exec sed -i 's/AI-видео для панно «Парусник»/AI-видео для панно «Девятый вал»/g' {} +

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
