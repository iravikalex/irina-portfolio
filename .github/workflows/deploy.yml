name: Deploy portfolio

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir _site
          for i in 00 01 02 03 04 05; do
            file=$(find . -maxdepth 1 -type f -name "*part-$i" -print -quit)
            test -n "$file"
            cat "$file" >> portfolio.zip
          done
          unzip -q portfolio.zip -d _site
          update_file=$(find . -maxdepth 1 -type f -name "*.zip" ! -name "portfolio.zip" -print -quit)
          test -n "$update_file"
          unzip -oq "$update_file" -d _site
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const assets = path.join('_site', 'assets');
          for (const name of fs.readdirSync(assets).filter((name) => name.endsWith('.js'))) {
            const file = path.join(assets, name);
            let source = fs.readFileSync(file, 'utf8');
            source = source.replaceAll('AI-видео для панно «Парусник»', 'AI-видео для панно «Девятый вал»');
            source = source.replaceAll('portfolio/cards/carrier/01.png', 'portfolio/cards/carrier/01.jpg');
            source = source.replaceAll(
              'Практическое руководство объёмом 65 страниц. В проект вошли структура материала, оформление обложки, работа с текстом и изображениями, подготовка страниц к дальнейшему редактированию.',
              'В портфолио представлен фрагмент из 10 оформленных страниц: обложка, восемь страниц с текстом и изображениями и задняя обложка. Книга находится в работе и будет дорабатываться.'
            );
            source = source.replaceAll('65 страниц', '10 страниц');
            source = source.replaceAll('Открыть книгу в PDF', 'Перелистать 10 страниц');
            source = source.replaceAll('7 роликов', '8 роликов');
            source = source.replaceAll(
              'Клиентская работа · 2 слайда',
              'Клиентская работа · исходники + 2 готовых слайда'
            );
            source = source.replace(
              /(\{id:`figurines`,[\s\S]*?slides:)\[[^\]]+\](,review:)/,
              '$1[`./portfolio/cards/figurines/01-main.png`,`./portfolio/cards/figurines/02-complete-set-new.png`,`./portfolio/cards/figurines/original-01.jpg`,`./portfolio/cards/figurines/original-02.jpg`]$2'
            );
            source = source.replace(
              /(\{id:`carrier`,[\s\S]*?slides:)\[[^\]]+\]/,
              '$1[`./portfolio/cards/carrier/01.jpg`,`./portfolio/cards/carrier/02.png`,`./portfolio/cards/carrier/03.png`,`./portfolio/cards/carrier/collage.png`]'
            );
            source = source.replaceAll(
              './portfolio/visuals/fantasy-night.webp',
              './portfolio/visuals/irina-child-bonnie.jpeg'
            );
            source = source.replace(
              /,\{src:`\.\/portfolio\/visuals\/bonnie-cutout\.webp`,label:`Обтравка изображения`\}/g,
              ''
            );
            source = source.replaceAll(
              '«Карточка шикарная. Мне очень нравится» — отзыв заказчика',
              '«Карточка шикарная! Несмотря на то, что я отправила вам товар в пакете, где нечётко видны детали, вы сделали всё очень хорошо и красиво 😍 Мне очень нравится 👍🏻 Спасибо большое!» — отзыв заказчика'
            );
            source = source.replace(
              '{title:`Анимация вращения`,description:`Короткий тест движения для акцента на товаре и удержания внимания.`,src:`./portfolio/videos/rotation.mp4`,poster:`./portfolio/videos/rotation.jpg`,tag:`Анимация`}',
              '{title:`Анимация вращения`,description:`Короткий тест движения для акцента на товаре и удержания внимания.`,src:`./portfolio/videos/rotation.mp4`,poster:`./portfolio/videos/rotation.jpg`,tag:`Анимация`},{title:`AI-история «Бонни и Вася»`,description:`Короткий сказочный сюжет с живой мимикой ребёнка, движением персонажей и переходом в волшебный лес.`,src:`./portfolio/videos/vasya-bonnie-story.mp4`,poster:`./portfolio/videos/vasya-bonnie-story.jpg`,tag:`AI-видео`}'
            );
            fs.writeFileSync(file, source);
          }
          NODE
          cp carrier-main-edited.jpg _site/portfolio/cards/carrier/01.jpg
          cp carrier-collage.png _site/portfolio/cards/carrier/collage.png
          cp figures-original-01.jpg _site/portfolio/cards/figurines/original-01.jpg
          cp figures-original-02.jpg _site/portfolio/cards/figurines/original-02.jpg
          cp irina-child-bonnie.jpeg _site/portfolio/visuals/irina-child-bonnie.jpeg
          cp vasya-bonnie-story.mp4 vasya-bonnie-story.jpg _site/portfolio/videos/
          cp book-excerpt-*.png _site/portfolio/book/
          rm -f _site/portfolio/book/epoxy-resin-guide.pdf
          cp portfolio-fix.js portfolio-fix.css _site/
          sed -i 's#</head>#<link rel="stylesheet" href="./portfolio-fix.css"></head>#' _site/index.html
          sed -i 's#</body>#<script src="./portfolio-fix.js"></script></body>#' _site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
